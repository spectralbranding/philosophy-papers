    source_observations: [O1]
    generating_method: M1
    value: "60 entities; 39 jurisdictions"
    units: "counts"
    uncertainty: "deterministic enumeration of a filed list; subject to C4"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"

  - id: m2
    statement: "The components of the perimeter moved on four distinct dates: control and charter and board at the effective time, officers retained, listing suspended the same day, registration terminated ten days later."
    source_observations: [O2]
    generating_method: M1
    value: "4 distinct dates across perimeter components"
    units: "categorical, dated"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"

  - id: m3
    statement: "Of 2,093 distinct source components, 33 declare no upstream; of the 2,060 codeable, 90 originate on a vendor-controlled or vendor-sponsored host and 1,970 do not."
    source_observations: [O4]
    generating_method: M2
