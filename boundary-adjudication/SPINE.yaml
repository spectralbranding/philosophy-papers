spine_version: "0.2"
paper_key: "boundary-adjudication"
title: "When a Boundary Claim Becomes Testable: A Criterion for Adjudicating Scale-Relative Claims, with One Coded Case"
thesis: |
  Claims that a self-maintaining or cognitive system extends to some scale are chronically
  underdetermined, because in the cases usually discussed the investigator draws the boundary and can
  redraw it around whatever is interesting. The live response is conceptual rather than empirical: it
  concedes that boundary-drawing is an interpretation and answers that interpretation is ubiquitous in
  science and so not disqualifying. That answer has a precondition it does not state, namely that the
  interpreter is the theorist. This paper specifies the class of domains in which that precondition
  fails — where a perimeter is fixed by a party whose reasons are indifferent to the hypothesis, is
  observable to someone who did not draw it, and moves only by dated events with recorded outcomes —
  and shows that within that class the measurable quantity is not whether a boundary is drawn
  correctly but what a hypothesis-independent perimeter fails to contain. One acquisition, coded from
  two disjoint document sets, is offered as an existence proof that the three conditions are jointly
  satisfiable and the divergence observable.

# ---------------------------------------------------------------------------
# BOUNDARY CONDITIONS
# ---------------------------------------------------------------------------
boundary_conditions:
  - id: C1
    statement: "The perimeter is fixed by a party whose reasons are indifferent to the hypothesis under test, not indifferent simpliciter."
    rationale: "No party is indifferent to everything. Exogeneity with respect to the hypothesis is what an instrument requires; exogeneity full stop is unavailable in any domain."
  - id: C2
    statement: "An audit or registry makes the perimeter inspectable by someone who did not draw it."
  - id: C3
    statement: "The perimeter moves only by discrete dated events whose outcomes are recorded."
  - id: C4
    statement: "The perimeter coded is the audited significant perimeter, not an exhaustive enumeration of legal entities."
    rationale: "Item 601(b)(21) of Regulation S-K permits omitting subsidiaries that, in the aggregate as a single subsidiary, would not be a significant subsidiary under Rule 1-02(w) of Regulation S-X."

# ---------------------------------------------------------------------------
# ASSUMPTION ATOMS
# ---------------------------------------------------------------------------
assumption_atoms:
  - id: AA1
    statement: "A published subsidiary schedule is a faithful enough enumeration of a firm's audited significant legal perimeter to support comparison."
    type: "data_source_trust"
    relaxable: true
    relaxation_consequence: "If the schedule under-reports materially, the coded perimeter is smaller than the real one. The direction is bounded: an omitted entity is still a legal entity, and cannot introduce an upstream project onto the list, so F3 is unreachable by this relaxation."
    affects: [M1, F1, F3]
    body_sections: ["Method — the legal coding"]
  - id: AA2
    statement: "A distribution's declared upstream URL identifies the project from which a component originates."
    type: "data_source_trust"
    relaxable: true
    relaxation_consequence: "URLs are packager-authored and can be stale or wrong. Errors are bounded by RC1 and by excluding undeclared cases rather than pooling them."
    affects: [M2, F2]
    body_sections: ["Method — the persistence coding"]
  - id: AA3
    statement: "A public rebuild of a commercial distribution preserves its source composition apart from branding artefacts."
    type: "instrument_equivalence"
    relaxable: true
    relaxation_consequence: "If the rebuild strips vendor-originated components, the measured outside-share is inflated. Checked directly rather than assumed: vendor-originated packages remain present in the rebuild."
    affects: [M2, F2]
    body_sections: ["Method — the persistence coding"]

# ---------------------------------------------------------------------------
# METHODS
# ---------------------------------------------------------------------------
methods:
  - id: M1
    statement: "Enumerate the audited legal perimeter and decompose the perimeter-event, from regulatory filings only."
    type: "archival_search"
    inputs: [O1, O2, O3]
    outputs: [m1, m2]
    reproducibility:
      seed: "deterministic (no RNG)"
      runtime_environment: "public filings retrieved by accession number"
    body_sections: ["Method — the legal coding"]
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
      under_conditions: "Filings-only rule: no community document, repository or press account may be read on this side."

  - id: M2
    statement: "Classify each source component of the product by the provenance of its declared upstream, from distribution package metadata only, under a host list fixed before the data was read."
    type: "qualitative_coding"
    inputs: [O4]
    outputs: [m3, m4]
    code_anchor: "code/code_persistence_content.py"
    reproducibility:
      seed: "deterministic (no RNG)"
      runtime_environment: "Python 3.12 + uv; offline, reads two archived metadata files"
    body_sections: ["Method — the persistence coding"]
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
      under_conditions: "Protocol fixed before the data was fetched. Two constraints bind it: no document shared with M1, and no keying on valuation difficulty."

# ---------------------------------------------------------------------------
# OBSERVATIONS
# ---------------------------------------------------------------------------
observations:
  - id: O1
    statement: "A subsidiary schedule stating the registrant's subsidiaries as of the last audited fiscal year end before the perimeter-event."
    raw_data_pointer: "data/redhat_ex21_1_fy2019.htm"
    instrument: "public filing, retrieved by accession number"
    timestamp: "2019-04-24"
    conditions_at_capture: "Exhibit 21.1 to the annual report; list stated as of 2019-02-28"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
    body_sections: ["Method — the legal coding"]

  - id: O2
    statement: "The completion report for the acquisition, reporting the effective time, the consideration, the delisting notice, and the disposition of board, officers and constitutional documents."
    raw_data_pointer: "public filing, current report dated 2019-07-09"
    instrument: "public filing"
    timestamp: "2019-07-09"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
    body_sections: ["Results — the perimeter-event"]

  - id: O3
    statement: "The merger proxy, disclosing retention arrangements and a separate restrictive-covenant agreement carrying non-competition, non-solicitation and perpetual confidentiality covenants."
    raw_data_pointer: "public filing, definitive merger proxy dated 2018-12-12"
    instrument: "public filing"
    timestamp: "2018-12-12"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
    body_sections: ["Discussion — the acquirer's own admission"]

  - id: O4
    statement: "Source-repository package metadata for the product release falling inside the window between the audited perimeter date and the perimeter-event."
    raw_data_pointer: "data/{baseos,appstream}-primary.xml.gz"
    instrument: "distribution repository metadata, authored by packagers for package managers"
    timestamp: "2019-05-07 (product release date)"
    conditions_at_capture: "Public rebuild of the commercial distribution; source repositories only"
    provenance:
      created_by: "author"
      created_at: "2026-08-28"
    body_sections: ["Method — the persistence coding"]

# ---------------------------------------------------------------------------
# MEASUREMENTS
# ---------------------------------------------------------------------------
measurements:
