external_anchors:
  - claim: "The standing critique that the boundary formalism equivocates between a formal property of a model and a metaphysically loaded boundary of a system."
    citation_keys: [bruineberg-2022-emperors-new-markov]
    citation_role: motivating_problem
    note: "The problem statement of the paper, not a threat to it."

  - claim: "The live defence of realism about model-drawn boundaries, which concedes that the interpretative step is performed by a theorist and denies only that interpretation implies arbitrariness."
    citation_keys: [kirchhoff-2025-literalist-fallacy-free-energy]
    citation_role: motivating_problem
    note: "Version of record held; the concession is at p. 652 and is explicit. Describe the position in its published scope -- realism about active inference models, not about the free energy principle."

  - claim: "Four conceptions of organizational boundaries, with an explicit call for research on the relationships among them rather than competition between them."
    citation_keys: [santos-2005-organizational-boundaries-theories]
    citation_role: theoretical_predecessor
    note: "The legal-ownership view is listed among the efficiency conception's contributions. The paper answers a call rather than defending a dismissed conception."

  - claim: "Legal partitioning and economic integration are jointly chosen, and the legal perimeter's stickiness follows from property and capital-structure law rather than from practice."
    citation_keys: [iacobucci-2007-economic-legal-boundaries]
    citation_role: rival_ruled_out
    note: "The identification-threat source, and the mechanism behind C3. It costs the criterion the word indifferent and pays for the stickiness argument outright."

  - claim: "A published subsidiary schedule is a reasonable proxy for a firm's significant subsidiaries, benchmarked against what firms report privately to the revenue authority."
    citation_keys: [dyreng-2020-strategic-subsidiary-disclosure]
    citation_role: methodological_source
    note: "Instrument validation for M1, and the source of C4. Cite as validation, not decoration: the claim that an audit makes the perimeter observable has been measured against a private benchmark rather than asserted. Its two stated limits are that the proxy is good for locations of SIGNIFICANT subsidiaries, and that nondisclosure concentrates in tax havens."

  - claim: "Established precedent for coding legal against economic firm boundaries from entity schedules and from control rights."
    citation_keys: [laporta-1999-corporate-ownership-around, claessens-2000-separation-ownership-control, almeida-2006-theory-pyramidal-ownership, altomonte-2026-business-groups-knowledge]
    citation_role: methodological_source
    note: "Concedes the coding technique outright. Each of the four codes the legal perimeter against another legal or financial construct -- ownership chains, the cash-flow-versus-control wedge, pyramidal structure, ultimate-owner group identification -- so both sides of every existing comparison come from the same register. That is what leaves the second term of this paper's comparison unoccupied, and it is why the concession is safe to make."

  - claim: "Asset partitioning is the function organizational law performs that contract alone cannot, which is why a legal perimeter is a thing a party outside the firm can inspect."
    citation_keys: [hansmann-2000-essential-role-organizational]
    citation_role: theoretical_predecessor
    note: "The conceptual basis the identification-threat source builds on, and the reason C2 is a claim about law rather than about disclosure practice."

  - claim: "The free energy principle is a model structure to which construals are added, so a demand for a discriminating test of the formalism is a category error; particular boundary claims are construals and are not covered by that defence."
    citation_keys: [andrews-2021-math-not-territory]
    citation_role: theoretical_predecessor
