limitations:
- description: Origin is not necessity. The measured share describes where the source composition comes
    from, not what proportion of it is counterfactually required.
  severity: major
  addressable: true
- description: The provenance proxy misclassifies vendor-led projects hosted on neutral infrastructure,
    and the error runs toward the outside category.
  severity: moderate
  addressable: true
- description: The persistence coding is mechanical, not blind. It was executed by a fixed pre-registered
    procedure over independent sources, but not by a coder ignorant of the hypothesis.
  severity: moderate
  addressable: true
- description: One case establishes satisfiability, not generality. A domain can also satisfy all three
    conditions while the coding instrument still cannot reach its escaping content, which is a limit on
    the method rather than on the criterion.
  severity: moderate
  addressable: true
- description: The criterion narrows C1 from indifference to indifference with respect to the hypothesis.
    This is a genuine weakening and is stated as one.
  severity: moderate
  addressable: true
- description: The paper does not show that realism about active inference models is false. It shows that
    one defence of realism about system boundaries is unavailable where the three conditions hold, and
    empirically idle where they do not.
  severity: moderate
  addressable: true
