methodology:
  type: empirical
  design: Enumerate the audited legal perimeter and decompose the perimeter-event, from regulatory filings
    only. Classify each source component of the product by the provenance of its declared upstream, from
    distribution package metadata only, under a host list fixed before the data was read.
  analysis:
