acceptance:
- claim_id: P1
  criterion: Holds if the standing defence of realism about model-drawn system boundaries presupposes
    that the interpretative step is performed by the theorist.
  falsification: A statement of the defence that does not rely on the ubiquity of theorist-performed interpretation.
- claim_id: P1a
  criterion: Holds if realism about active inference models as representations of target systems is a
    distinct thesis from realism about the location of any particular system boundary.
  falsification: A reading on which the defence's conclusion about models entails, rather than merely
    presupposes, a thesis about where particular systems end.
- claim_id: P2
  criterion: Holds if where a perimeter satisfies hypothesis-independence, observability and dated mobility,
    the defence in P1 is unavailable, and the dispute recovers empirical content.
  falsification: A domain meeting C1-C3 in which realist and instrumentalist readings still make identical
    predictions.
- claim_id: P3
  criterion: 'Holds if within a qualifying domain the measurable quantity is boundary failure rather than
    boundary correctness: what escapes a hypothesis-independent perimeter is evidence, whereas what escapes
    an investigator-drawn perimeter is an artefact of where it was drawn.'
  falsification: A hypothesis-independent perimeter whose residual varies with the investigator's choices.
- claim_id: P4
  criterion: 'Holds if the criterion''s principal yield is negative: it identifies most domains in which
    boundary disputes are conducted as domains where no observation could settle them, for the hypotheses
    relative to which the investigator is the perimeter-setter.'
  falsification: A demonstration that the usual cases satisfy C1-C3 after all.
- claim_id: P4a
  criterion: Holds if the exclusion is hypothesis-relative and divides into two classes.
  falsification: A physical interface whose status as the system boundary is fixed by the investigator
    under every hypothesis, or a purely model-relative partition that some party fixes independently.
- claim_id: P5
  criterion: Holds if a firm is an existence proof that the three conditions are jointly satisfiable;
    it is an instrument for the boundary question and not a subject of it.
  falsification: Any showing that firms fail one of C1-C3, or that the paper's inferences require attributing
    cognition to firms.
