# Data of record for 2026bo. One canonical home per artifact: the raw inputs live
# on Hugging Face, the derived output is regenerated by the committed script and is
# deliberately stored nowhere. Duplication is how two copies drift apart.
paper_key: boundary-adjudication
canonical_number: "2026bo"
zenodo_concept_doi: "10.5281/zenodo.22148374"
zenodo_version_doi: "10.5281/zenodo.22148375"

dataset_of_record:
  repo_id: spectralbranding/boundary-adjudication-data
  repo_type: dataset
  url: https://huggingface.co/datasets/spectralbranding/boundary-adjudication-data
  doi: "10.57967/hf/10145"
  doi_revision: "764bdfb"
  license: CC-BY-4.0
  category: >-
    Primary data of record. Not regenerable by this project: the legal side is an
    archival snapshot of a filed public record, and the persistence side is
    repository metadata for a distribution that reached end of life on 2021-12-31
    and has since been retired from the primary mirror network.

  files:
    - name: redhat_ex21_1_fy2019.htm
      side: legal
      description: >-
        Exhibit 21.1 to Red Hat's Form 10-K for fiscal 2019, filed 2019-04-24,
        accession 0001087423-19-000012; subsidiaries stated as of 2019-02-28.
      canonical_source: >-
        SEC EDGAR, which remains the authoritative copy; this is an archival
        snapshot so the coding reproduces from a fixed artifact.
    - name: redhat_ex21_1_fy2019.txt
      side: legal
      description: The same exhibit parsed to plain text; 60 entities, 39 jurisdictions.
    - name: baseos-primary.xml.gz
      side: persistence
      description: primary.xml.gz repository metadata, BaseOS source repository, CentOS 8.0.1905.
    - name: appstream-primary.xml.gz
      side: persistence
      description: primary.xml.gz repository metadata, AppStream source repository, CentOS 8.0.1905.

  disjointness: >-
    The legal and persistence files share no document and neither set was authored
    with the other in view. That is the design, and it is what makes the divergence
    between them something other than one drafter's choice.

regenerated_not_stored:
  - name: data/persistence_coding_rows.tsv
    produced_by: code/code_persistence_content.py
    rows: 2093
    reason: >-
      Deterministic output of a committed script with no randomness and no network
      access. Category 1 under the corpus data-storage standard: ship the script,
      never the output. Verified to regenerate byte-identically.

reproduce:
  command: ./reproduce.sh
  network_required: true   # one Hugging Face download; the coding script itself is offline
