[project]
name = "<repo-slug>"
version = "1.0.0"
description = "<one-line description>"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Dmitry Zharnikov", email = "fermeradar@gmail.com" },
]
keywords = ["spectral brand theory", "organizational schema theory"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/spectralbranding/<repo-slug>"
"Zenodo" = "https://doi.org/10.5281/zenodo.<concept-doi>"

[tool.uv]
# A reproduction bundle is a collection of scripts, not an installable library:
# it ships no package directory matching the project name. Without this, `uv run`
# inside the mirror tries to build a wheel and dies in hatchling with
# "Unable to determine which files to ship inside the wheel" — which takes down
# reproduce.sh before its first line of analysis. Keep this false unless the
# mirror genuinely ships an importable package.
package = false
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
