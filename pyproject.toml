[project]
name = "philosophy-papers"
version = "1.0.0"
description = "Philosophy-of-science research: when a claim about where a system ends has empirical content"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Dmitry Zharnikov", email = "dmitry@spectralbranding.com" },
]
keywords = ["philosophy of science", "system boundaries", "scientific realism", "philosophy of measurement"]
# The coding script is stdlib-only by design, so it can be audited as offline and
# deterministic. huggingface_hub is needed only by reproduce.sh, to fetch the data
# of record before the script runs.
dependencies = [
    "huggingface-hub>=0.34",
]

[project.urls]
"Homepage" = "https://github.com/spectralbranding/philosophy-papers"
"Zenodo" = "https://doi.org/10.5281/zenodo.22148374"

[tool.uv]
# A reproduction bundle is a collection of scripts, not an installable library:
# it ships no package directory matching the project name. Without this, `uv run`
# inside the mirror tries to build a wheel and dies in hatchling with
# "Unable to determine which files to ship inside the wheel" — which takes down
# reproduce.sh before its first line of analysis. Keep this false unless the
# mirror genuinely ships an importable package.
package = false
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
